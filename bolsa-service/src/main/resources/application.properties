# ===========================================
# BOLSA SERVICE CONFIGURATION
# ===========================================
spring.application.name=bolsa-service
server.port=8082

# Database
spring.datasource.url=jdbc:mysql://mysql:3306/db_bolsa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Eureka
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===========================================
# INTERACTIVE BROKERS CONFIGURATION
# ===========================================
# Configuración para IB Gateway
ib.host=127.0.0.1
ib.port=7497
ib.client-id=1
ib.paper-trading=true

# Logging para IB API
logging.level.com.edu.unbosque.bolsa_service.service.IBService=DEBUG
logging.level.com.ib.client=INFO

# Configuración adicional para IB Gateway
ib.connection-timeout=10000
ib.read-timeout=5000